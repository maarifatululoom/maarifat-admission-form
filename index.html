const cfee=k=>(k.courses||[]).reduce((s,key)=>{const c=COURSES.find(x=>x[1]===key);return s+(c?cprice(c):0)},0);
const srvLevel=k=>{const o=(k.courses||[]).map(key=>levels.find(l=>l[1]===key)).filter(Boolean)[0];return o?o[0]:'Nazra Quran'};
const cnames=k=>(k.courses||[]).map(key=>(COURSES.find(x=>x[1]===key)||[key])[0]).join(', ');
const times=[['Morning','morning'],['Afternoon','afternoon'],['Evening','evening']];
const opts=(a,sel)=>`<option value="">${t('select')}</option>`+a.map(([v,k])=>`<option value="${v}"${sel===v?' selected':''}>${t(k)}</option>`).join('');
function save(){document.querySelectorAll('.child').forEach((c,i)=>{const g=n=>c.querySelector('[name='+n+']').value;kids[i]={name:g('name'),dob:g('dob'),gender:g('gender'),courses:[...c.querySelectorAll('input[name=course]:checked')].map(x=>x.value),timing:g('timing'),time:g('time')}})}
function calc(){const n=kids.length,d=n>=3?D3:n===2?D2:0,raw=kids.map(cfee),fees=raw.map(r=>Math.round(r*(100-d)/100)),sm=a=>a.reduce((x,y)=>x+y,0);return{n,d,raw,fees,rawTot:sm(raw),tot:sm(fees)}}
function renderFee(){const c=calc();$('fee').innerHTML=`<b>${t('feeHead')}</b>`+kids.map((k,i)=>`<div class="r"><span>${t('student')} ${i+1}${k.name?' \u2013 '+esc(k.name):''}</span><span>${rs(c.raw[i])}</span></div>`).join('')+(c.d&&c.rawTot?`<div class="r off"><span>${t('discount')} (${c.d}%)</span><span>\u2212 ${rs(c.rawTot-c.tot)}</span></div>`:'')+`<div class="r tot"><span>${t('total')}</span><span${c.tot!==lastTot?' class="pop"':''}>${rs(c.tot)}</span></div>`;lastTot=c.tot}
function renderKids(){
  $('kids').innerHTML=kids.map((k,i)=>`<div class="child"><h3><span>${t('student')} ${i+1}</span>${kids.length>1?`<button type="button" class="rm" data-rm="${i}">${t('remove')}</button>`:''}</h3>
  <label>${t('cName')}</label><input name="name" maxlength="100" value="${(k.name||'').replace(/"/g,'&quot;')}">
  <label>${t('dob')}</label><input name="dob" type="date" value="${k.dob||''}">
  <label>${t('gender')}</label><select name="gender"><option value="">${t('select')}</option><option value="Male"${k.gender==='Male'?' selected':''}>${t('male')}</option><option value="Female"${k.gender==='Female'?' selected':''}>${t('female')}</option></select>
  <label>${t('courses')}</label><div class="crs">${COURSES.map(c=>`<label class="${(k.courses||[]).includes(c[1])?'on':''}"><input type="checkbox" name="course" value="${c[1]}"${(k.courses||[]).includes(c[1])?' checked':''}><span>${t(c[1])}</span><b>${rs(cprice(c))}</b></label>`).join('')}</div><div class="sfee">${t('feeThis')}: <span data-sf="${i}">${rs(cfee(k))}</span></div>
  <label>${t('timing')}</label><select name="timing">${opts(times,k.timing)}</select>
  <label>${t('exact')}</label><input name="time" type="time" value="${k.time||''}"></div>`).join('');
  renderFee();
}
function applyLang(){
  document.documentElement.lang=lang==='en'?'en':'ur-Latn';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('bEn').classList.toggle('on',lang==='en');$('bRu').classList.toggle('on',lang==='ru');
  save();renderKids();
}
function setTheme(d){document.documentElement.dataset.theme=d?'dark':'light';$('bTh').textContent=d?'☀️':'🌙';localStorage.setItem('dark',d?'1':'0')}
$('bEn').onclick=()=>{lang='en';localStorage.setItem('lang',lang);applyLang()};
$('bRu').onclick=()=>{lang='ru';localStorage.setItem('lang',lang);applyLang()};
$('bTh').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
$('add').onclick=()=>{if(kids.length<8){save();kids.push({});renderKids()}};
$('kids').onchange=e=>{if(e.target.name==='course'){e.target.closest('label').classList.toggle('on',e.target.checked);save();renderFee();document.querySelectorAll('.child').forEach((c,i)=>{const s=c.querySelector('[data-sf]');if(s)s.textContent=rs(cfee(kids[i]))})}};
$('kids').onclick=e=>{const r=e.target.dataset.rm;if(r!==undefined){save();kids.splice(+r,1);renderKids()}};
const phone=v=>{let d=(v||'').replace(/\D/g,'');if(/^92\d{10}$/.test(d))d='0'+d.slice(2);else if(/^3\d{9}$/.test(d))d='0'+d;return d};
function showErr(m){const e=$('err');e.textContent=m;e.style.display=m?'block':'none';if(m)e.scrollIntoView({behavior:'smooth',block:'center'})}
$('f').onsubmit=async ev=>{
  ev.preventDefault();save();showErr('');
  const wa=phone($('wa').value),emg=phone($('emg').value);
  if(!$('gName').value.trim())return showErr(t('eName'));
  if(!/^03\d{9}$/.test(wa))return showErr(t('eWa'));
  if(!/^03\d{9}$/.test(emg))return showErr(t('eEmg'));
  for(const k of kids){
    if(!(k.name||'').trim())return showErr(t('eKid'));
    if(!k.dob||k.dob>new Date().toISOString().slice(0,10))return showErr(t('eDob'));
    if(!k.gender||!k.timing)return showErr(t('eSel'));
    if(!(k.courses||[]).length)return showErr(t('eCourse'));
  }
  const body={guardian_name:$('gName').value.trim(),whatsapp:wa,emergency_contact:emg,email:$('email').value.trim(),off_days:$('off').value,message:((()=>{const c=calc();return 'Courses: '+kids.map((k,i)=>(k.name||'').trim()+' = '+cnames(k)+' ('+rs(c.fees[i])+')').join(' | ')+' | Total '+rs(c.tot)+'/month'+($('msg').value.trim()?'\n'+$('msg').value.trim():'')})()).slice(0,1000),website:$('website').value,
    children:kids.map(k=>({name:k.name.trim(),dob:k.dob,gender:k.gender,level:srvLevel(k),timing:k.timing,exact_time:k.time}))};
  const go=$('go');go.disabled=true;go.textContent=t('sending');
  try{
    let d;
    if(DEMO){await new Promise(r=>setTimeout(r,800));d={roll_nos:kids.map((_,i)=>101+i),total:calc().tot}}
    else{
      const r=await fetch(SB+'/rest/v1/rpc/submit_admission_public',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({p:body})});
      d=await r.json();
      if(!r.ok){const m=d.message||'';showErr(m==='rate_limited'?t('eRate'):m==='invalid_whatsapp'?t('eWa'):m==='invalid_dob'?t('eDob'):t('eGen'));return}
    }
    $('f').classList.add('hide');$('done').classList.remove('hide');
    $('rolls').textContent=(d.roll_nos||[]).join(', ');$('dtot').textContent=rs(calc().tot);scrollTo(0,0);
  }catch(e){showErr(t('eGen'))}
  finally{go.disabled=false;go.textContent=t('submit')}
};
document.querySelectorAll('#f>*').forEach((e,i)=>e.style.setProperty('--i',i));
setTheme(localStorage.getItem('dark')==='1');applyLang();
// When shown inside the academy website, tell the page how tall the form is so it can grow without an inner scrollbar
if(window.parent!==window){document.documentElement.classList.add('emb');const send=()=>{try{parent.postMessage({maarifatForm:Math.ceil(document.body.getBoundingClientRect().height)},'*')}catch(e){}};if(window.ResizeObserver)new ResizeObserver(send).observe(document.body);addEventListener('load',send);addEventListener('resize',send);send()}
// fee, discounts, due day, name and logo come from the academy's Settings
if(!DEMO)fetch(SB+'/rest/v1/rpc/public_settings',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:'{}'}).then(r=>r.json()).then(s=>{
  if(!s||typeof s!=='object')return;
  if(s.fee_base!=null)BASE=+s.fee_base;if(s.discount_2!=null)D2=+s.discount_2;if(s.discount_3!=null)D3=+s.discount_3;if(s.due_day)DUE=+s.due_day;
  if(s.academy_name){document.querySelectorAll('h1,.fn').forEach(e=>e.textContent=s.academy_name);document.title=document.title.replace('Maarifat-ul-Uloom Academy',s.academy_name)}
  if(s.logo_dark_url)document.querySelectorAll('.lgD').forEach(i=>i.src=s.logo_dark_url);
  if(s.logo_light_url)document.querySelectorAll('.lgL').forEach(i=>i.src=s.logo_light_url);
  applyLang();
}).catch(()=>{});
</script>
</body>
</html>
